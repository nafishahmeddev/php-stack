services:
  php85:
    build:
      context: ./php85
    container_name: php85-fpm
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "9085:9000"
    extra_hosts:
      - "socket.al-ameen.lo:host-gateway"
      - "api.al-ameen.lo:host-gateway"
      - "al-ameen.lo:host-gateway"
    volumes:
      - ./php85/php.ini:/etc/php/8.5/fpm/php.ini
      - ./php85/php.ini:/etc/php/8.5/cli/php.ini
      - ./php85/php-fpm.conf:/etc/php/8.5/fpm/pool.d/z-overrides.conf
      - ${HOST_WWW_PATH:-/var/www}:/var/www
    networks:
      - php-network

networks:
  php-network:
    driver: bridge
