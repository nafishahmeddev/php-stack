# Phurdle Nginx Configuration
# Instructions:
# 1. Copy or Symlink this file to /etc/nginx/sites-available/phurdle
#    sudo cp nginx.conf /etc/nginx/sites-available/phurdle
# 2. Enable the site
#    sudo ln -s /etc/nginx/sites-available/phurdle /etc/nginx/sites-enabled/
# 3. Test configuration and reload Nginx
#    sudo nginx -t
#    sudo systemctl reload nginx

# PHP 7.3 Server (Port 8073)
server {
    listen 8073;
    server_name localhost;
    root /var/www;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9073;
    }
}

