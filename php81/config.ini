[PHP]
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; =============================================================
; EXTENSION LOADING
; =============================================================
extension=calendar
extension=exif
extension=gd
extension=gettext
extension=mysqli
extension=pdo_mysql
extension=pcntl
extension=shmop
extension=sockets
extension=sysvmsg
extension=sysvsem
extension=sysvshm
extension=xsl
extension=zip

; =============================================================
; ZEND EXTENSIONS
; =============================================================
zend_extension=opcache

[opcache]
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
