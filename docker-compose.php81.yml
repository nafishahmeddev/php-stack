version: '3.8'

services:
  php81:
    build:
      context: ./php81
    container_name: php81-fpm
    restart: unless-stopped
    ports:
      - "9081:9000"
    volumes:
      - ./php81/php.ini:/etc/php/8.1/fpm/php.ini
      - ./php81/php.ini:/etc/php/8.1/cli/php.ini
      - ./php81/php-fpm.conf:/etc/php/8.1/fpm/pool.d/z-overrides.conf
      - /var/www:/var/www
