services:
  php73:
    build:
      context: ./php73
    container_name: php73-fpm
    restart: unless-stopped
    ports:
      - "9073:9000"
    extra_hosts:
      - "socket.al-ameen.lo:host-gateway"
      - "api.al-ameen.lo:host-gateway"
      - "al-ameen.lo:host-gateway"
    volumes:
      - ./php73/php.ini:/etc/php/7.3/fpm/php.ini
      - ./php73/php.ini:/etc/php/7.3/cli/php.ini
      - ./php73/php-fpm.conf:/etc/php/7.3/fpm/pool.d/z-overrides.conf
      - ${HOST_WWW_PATH:-/var/www}:/var/www
    networks:
      - php-network

networks:
  php-network:
    driver: bridge
