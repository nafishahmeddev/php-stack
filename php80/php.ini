[PHP]
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
date.timezone = UTC
log_errors = On
error_reporting = E_ALL

; --- Dynamic Extension Management ---
; Uncomment extensions to enable them

extension=calendar
extension=exif
extension=gd
extension=gettext
extension=mysqli
extension=pdo_mysql
extension=pcntl
extension=shmop
extension=sockets
extension=sysvmsg
extension=sysvsem
extension=sysvshm
extension=xsl
extension=zip

; Note: Some extensions might be compiled statically (Core, Date, etc.) 
; and don't need 'extension=' unless installed as shared modules.
; The docker-php-ext-install usually builds them as shared (.so).

[opcache]
zend_extension=opcache
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
