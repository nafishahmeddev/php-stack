services:
  php74:
    build:
      context: ./php74
    container_name: php74-fpm
    restart: unless-stopped
    ports:
      - "9074:9000"
    extra_hosts:
      - "socket.al-ameen.lo:host-gateway"
    volumes:
      - ./php74/php.ini:/etc/php/7.4/fpm/php.ini
      - ./php74/php.ini:/etc/php/7.4/cli/php.ini
      - ./php74/php-fpm.conf:/etc/php/7.4/fpm/pool.d/z-overrides.conf
      - ${HOST_WWW_PATH:-/var/www}:/var/www
    networks:
      - php-network

networks:
  php-network:
    driver: bridge
