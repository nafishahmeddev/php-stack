[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = notice

[www]
listen = 9000
user = www-data
group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 100

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
