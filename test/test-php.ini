[PHP]
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
date.timezone = UTC
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
output_buffering = 0
implicit_flush = 1
realpath_cache_size = 0
short_open_tag = On

[CLI Server]
cli_server.color = On

[mysql]
mysql.default_host =
mysql.default_user =
mysql.default_password =
mysql.default_port = 3306

[mysqli]
mysqli.default_host =
mysqli.default_user =
mysqli.default_password =
mysqli.default_port = 3306
mysqli.allow_persistent = On
mysqli.max_persistent = -1
mysqli.max_links = -1

[opcache]
opcache.enable=0
opcache.enable_cli=0
